<header class="site-header">
    <div class="container">
        <div class="header-content">
            <div class="site-title">
                <a href="{{ '/' | relative_url }}">
                    <img src="{{ '/assets/images/DRC-FinalLogo.svg' | relative_url }}" alt="{{ site.title }} logo" class="site-logo" width="64" height="64">
                    <em>{{ site.title }} - NH Running Community</em>
                </a>
            </div>
            <nav class="site-nav" aria-label="Main navigation">
                <ul>
                    <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a></li>
                    <li><a href="{{ '/routes.html' | relative_url }}"{% if page.url == '/routes.html' %} aria-current="page"{% endif %}>Routes</a></li>
                    <li><a href="{{ '/our-story.html' | relative_url }}"{% if page.url == '/our-story.html' %} aria-current="page"{% endif %}>Our Story</a></li>
                    <li><a href="{{ '/gallery.html' | relative_url }}"{% if page.url == '/gallery.html' %} aria-current="page"{% endif %}>Gallery</a></li>
                    <li><a href="{{ '/supporters.html' | relative_url }}"{% if page.url == '/supporters.html' %} aria-current="page"{% endif %}>Supporters</a></li>
                </ul>
            </nav>
        </div>
    </div>
</header>
